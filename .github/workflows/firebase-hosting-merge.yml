name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set Node to modern LTS (20)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Standard clean install
      - name: Install dependencies
        run: npm ci

      # Clean modern build (no NODE_OPTIONS needed)
      - name: Build
        run: npm run build

      # Firebase deploy action (configured automatically by the CLI)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_F6B57}}'
          channelId: live
          projectId: your-project-id